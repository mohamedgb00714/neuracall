name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22+ is required, not preferred: @neuracall/crm uses the built-in
      # node:sqlite, which does not exist before 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` (not `install`) so the lockfile is authoritative and a drifting
      # transitive dependency fails the build instead of silently changing it.
      - run: npm ci

      - name: Lint
        run: npm run lint

      # The whole tree was formatted in one standalone commit, so this is green
      # from the day it was added — a gate introduced while already red just
      # trains people to ignore CI.
      - name: Format
        run: npm run format:check

      # Builds every workspace. The e2e suite consumes the other packages
      # through their published `dist/`, so this has to happen before tests.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The full mocked-call loop: real device-manager, aai-client, pipeline,
      # orchestrator and agent, with adb, the A2I WebSocket, scrcpy, the LLM
      # and TTS stubbed. Needs no device, no API key and no network.
      - name: End-to-end tests
        run: npm run test:e2e
