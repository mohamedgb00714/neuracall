# =============================================================================
# nginx-block-404-noise.conf  --  drop-in http-context block maps
#
# Part of: autoplans.dev vulnerability-scanner / credential-probe noise fix.
# These maps let the autoplans.dev vhost answer 410/403 for scanner paths
# BEFORE proxying to :3000, so the probes never reach the app and never
# create 404 error-telemetry groups.
#
# INSTALL (with root) next to the vhost:
#     sudo cp infra/nginx-block-404-noise.conf /etc/nginx/sites-enabled/
#     sudo cp infra/nginx-autoplans.dev.conf.patch /etc/nginx/sites-enabled/autoplans.dev
#     sudo nginx -t && sudo systemctl reload nginx
#
# This file only defines maps, which are legal ONLY in the http context.
# nginx.conf includes /etc/nginx/sites-enabled/* inside http{}, so a file
# placed there parses fine at http level. The maps are passive until the
# patched autoplans.dev vhost references $blocked / $ua_blocked; the odoo
# vhost is untouched.
#
# KEY DESIGN POINT: the URI map keys on $uri, which nginx has already
# normalized - percent-decoded EXCEPT %2F, dot-segments resolved. So:
#   * /configs%2ejson arrives here as /configs.json  -> caught by the plain
#     config-dump rule, no extra encoded-dot rule needed.
#   * double-encoded leftovers like /configs%252ejson stay as ...%2e, and
#     encoded slashes stay as %2f - those get the explicitly encoded rules
#     at the bottom.
# Match values are either `1` (block) or the default `0` (pass through).
# =============================================================================


# --- URI blocklist -----------------------------------------------------------
# $blocked == 1  =>  vhost answers 410 Gone, request never reaches :3000.
# Regex keys are case-insensitive (~*). Rules are anchored (^...$ or /any-depth
# with a leading ^/) so ordinary route words like "settings" or "config" are
# never caught; only the dump-shaped forms are.
map $uri $blocked {
    default 0;

    # -- archive / database dumps (any depth, extension-based; covers future
    #    probe names too, per the task: /<name>.zip, /<name>.tar.gz,
    #    /<name>.sql*, /db*, /database*, backup-ish names)
    ~*\.(zip|rar|7z|tar|tgz|bz2|xz)$            1;
    ~*\.tar\.gz$                                1;
    ~*\.sql(\.gz)?$                             1;
    ~*\.(sqlite|sqlite3|db)$                    1;
    ~*\.(bak|old|backup|dump|orig|save|tmp)$    1;
    ~*^/(db|database)(\.|$)                     1;
    ~*^/backups?                                1;

    # -- credential / config dump files
    ~*^/(configs?|settings|application|environment|local|web)\.(json|js|yaml|yml|py|php|ini|conf|config|env|txt|xml)$  1;
    ~*appsettings[^/]*\.json$                   1;
    ~*local\.settings\.json$                    1;
    ~*web\.config$                              1;
    ~*^/config/[^/]*\.(js|json|py|php|env|yaml|yml|ini|conf)$   1;
    ~*^/emails/[^/]*\.(js|json|env|py|php)$     1;
    ~*probuildkeys                              1;
    ~*~$                                        1;   # text-editor backup suffix (config.php~)
    ~*\.swp$                                    1;   # vim swap probes

    # -- credential dotfiles / secret key material (any depth, extension-based)
    ~*\.env(\.[a-z0-9_-]+)?$                    1;
    ~*^/env(\.|$)                               1;
    ~*\.(htpasswd|htaccess|netrc|npmrc|s3cfg|pgpass|my\.cnf)$   1;
    ~*\.(pem|key|p12|pfx|jks|keystore)$         1;
    ~*(id_rsa|id_dsa|id_ecdsa|id_ed25519)$      1;
    ~*credentials[^/]*\.json$                   1;
    ~*service[_-]?account[^/]*\.json$           1;
    ~*secrets?\.[a-z0-9]+$                      1;
    ~*terraform\.(tfstate|tfvars)               1;
    ~*^/\.(git|svn|hg)(/|$)                     1;
    ~*\.git/(config|HEAD|objects|refs)          1;
    ~*\.(aws|kube|azure|claude|cursor|mcp|codex|ssh)/   1;

    # -- software this site does not run (CMS / framework / infra probing)
    ~*^/wp[-\/]                                 1;   # /wp-json, /wp-admin, /wp/v2/*
    ~*wp-json                                   1;
    ~*xmlrpc\.php$                              1;
    ~*^/livewire                                1;   # /livewire/update
    ~*^/(telescope|_debugbar|_profiler|horizon|nova|pulse|phpinfo)(/|$)   1;
    ~*^/actuator(/|$)                          1;   # Spring Boot actuate
    ~*^/(owa|ecp|autodiscover|exchange|phpmyadmin|pma|cgi-bin|aspnet_client|webdav)(/|$)  1;
    ~*^/(graphql|gql|graphiql)(/|$)             1;
    ~*^/swagger                                 1;
    ~*^/openapi(\.|_)                           1;
    ~*^/api-docs(/|$)                           1;
    ~*^/(_cat|elasticsearch|kibana|logstash)(/|$) 1;
    ~*^/v2/_catalog(/|$)                        1;
    ~*^/(composer\.(json|lock)|artisan|vendor)  1;

    # -- observed probe paths on this host
    ~*^/server$                                 1;
    ~*^/tasting(/|$)                            1;
    ~*^/api$                                    1;
    ~*^/api/(env|config|keys?|secret|credential) 1;

    # -- encoded leftovers nginx normalization does NOT decode:
    #    %2f (encoded slash) is never decoded by nginx; double-encoded dots
    #    land here as literal %2e after the single %25->% pass.
    ~*%2[fF](wp|livewire|_catalog|\.\.)         1;
    ~*(wp|livewire|_catalog)%2[fF]              1;
    ~*\.\.%2[fF]                                1;   # traversal /..%2f
    ~*%2e%2e                                    1;   # fully-encoded .. 
    ~*%(25)*2e(json|js|env|sql|php|yaml|yml|zip|tar|bak) 1;   # double/triple-encoded dot leftovers: %2e, %252e, %25252e, ...
    ~*%00                                       1;   # null-byte probes
}


# --- User-Agent blocklist ----------------------------------------------------
# $ua_blocked == 1  =>  vhost answers 403 Forbidden.
# Deliberately CONSERVATIVE: only unambiguous automated scanner / exploit-tool
# User-Agents are listed. Nothing generic (curl, Go-http-client, python-requests,
# browser engines, SEO crawlers) is blocked on UA alone - those are shared by
# legitimate clients and health checks. Most of the noise is already stopped by
# the path rules above; this layer only mops up the obvious tool signatures.
map $http_user_agent $ua_blocked {
    default 0;
    ~*sqlmap                                    1;
    ~*nikto                                     1;
    ~*nuclei                                    1;
    ~*wpscan                                    1;
    ~*masscan                                   1;
    ~*zgrab                                     1;
    ~*nessus                                    1;
    ~*openvas                                   1;
    ~*acunetix                                  1;
    ~*netsparker                                1;
    ~*arachni                                   1;
    ~*w3af                                      1;
    ~*nmap                                      1;
    ~*metasploit                                1;
    ~*wfuzz                                     1;
    ~*gobuster                                  1;
    ~*dirbuster                                 1;
    ~*(cmsexplorer|joomlavs|plecost)            1;
}